name: Test Video Task Admin UI

on:
  push:
    branches: [main]
    paths: [frontend/**, .github/workflows/test-video-task-admin-ui.yml]
  pull_request:
    paths: [frontend/**, .github/workflows/test-video-task-admin-ui.yml]

permissions:
  contents: read

jobs:
  test-video-task-admin-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun ci
      - name: Build admin
        run: bun run --filter frontend build
        env:
          VITE_API_URL: ""
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: frontend
      - name: Test task operations against mocked APIs only
        run: bun run test:video-tasks
        working-directory: frontend
      - name: Test read-only wallet and identity labels against mocked APIs only
        run: bun run test:admin-readonly
        working-directory: frontend
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: video-task-admin-ui-evidence
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
