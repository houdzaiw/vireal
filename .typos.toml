# Xcode identifiers are generated 24-character hexadecimal values.
[default]
extend-ignore-re = ["\\b[0-9A-F]{24}\\b"]

# Preserve the upstream Wan input field's spelling; changing it breaks the API.
[default.extend-identifiers]
refert_num = "refert_num"

# Keep the upstream alls-green action/status name stable for branch protection.
[default.extend-words]
alls = "alls"
