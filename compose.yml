x-app-environment: &app-environment
  PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
  SECRET_KEY: ${SECRET_KEY:?Variable not set}
  FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
  FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
  SENTRY_DSN: ${SENTRY_DSN:-}
  FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5173}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-[]}
  APP_IMAGE_STORAGE_BACKEND: ${APP_IMAGE_STORAGE_BACKEND:-local}
  LOCAL_UPLOAD_DIR: ${LOCAL_UPLOAD_DIR:-uploads}
  MAX_UPLOAD_IMAGE_BYTES: ${MAX_UPLOAD_IMAGE_BYTES:-5242880}
  R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
  R2_OBJECT_PREFIX: ${R2_OBJECT_PREFIX:-vireal}
  R2_DOWNLOAD_URL_EXPIRE_SECONDS: ${R2_DOWNLOAD_URL_EXPIRE_SECONDS:-300}
  R2_REPLICATE_URL_EXPIRE_SECONDS: ${R2_REPLICATE_URL_EXPIRE_SECONDS:-3600}
  R2_VIDEO_PLAYBACK_URL_EXPIRE_SECONDS: ${R2_VIDEO_PLAYBACK_URL_EXPIRE_SECONDS:-300}
  APP_MEDIA_RETENTION_HOURS: ${APP_MEDIA_RETENTION_HOURS:-24}
  MAX_GENERATED_VIDEO_BYTES: ${MAX_GENERATED_VIDEO_BYTES:-262144000}
  VIDEO_WORKER_POLL_SECONDS: ${VIDEO_WORKER_POLL_SECONDS:-2}
  VIDEO_WORKER_MAX_ATTEMPTS: ${VIDEO_WORKER_MAX_ATTEMPTS:-5}
  VIDEO_CLEANUP_INTERVAL_SECONDS: ${VIDEO_CLEANUP_INTERVAL_SECONDS:-60}
  APP_USER_DAILY_REAL_SUBMISSIONS: ${APP_USER_DAILY_REAL_SUBMISSIONS:-5}
  APP_WAN_DAILY_GLOBAL_SUBMISSIONS: ${APP_WAN_DAILY_GLOBAL_SUBMISSIONS:-3}
  LOCAL_DEMO_ENABLED: ${LOCAL_DEMO_ENABLED:-true}
  LOCAL_DEMO_FFMPEG_PATH: ${LOCAL_DEMO_FFMPEG_PATH:-/usr/bin/ffmpeg}
  LOCAL_DEMO_TIMEOUT_SECONDS: ${LOCAL_DEMO_TIMEOUT_SECONDS:-180}
  REPLICATE_ENABLED: ${REPLICATE_ENABLED:-false}
  REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
  REPLICATE_STANDARD_MODEL: ${REPLICATE_STANDARD_MODEL:-minimax/video-01}
  REPLICATE_ADVANCED_MODEL: ${REPLICATE_ADVANCED_MODEL:-wan-video/wan-2.7-r2v}
  REPLICATE_R2V_MODEL: ${REPLICATE_R2V_MODEL:-wan-video/wan-2.7-r2v}
  REPLICATE_ANIMATE_MODEL: ${REPLICATE_ANIMATE_MODEL:-wan-video/wan-2.2-animate-animation}
  REPLICATE_WEBHOOK_URL: ${REPLICATE_WEBHOOK_URL:-}
  REPLICATE_WEBHOOK_SIGNING_SECRET: ${REPLICATE_WEBHOOK_SIGNING_SECRET:-}
  REPLICATE_REQUEST_TIMEOUT_SECONDS: ${REPLICATE_REQUEST_TIMEOUT_SECONDS:-30}
  REPLICATE_WEBHOOK_TOLERANCE_SECONDS: ${REPLICATE_WEBHOOK_TOLERANCE_SECONDS:-300}
  REPLICATE_POC_MAX_SUBMISSIONS: ${REPLICATE_POC_MAX_SUBMISSIONS:-0}
  APP_GENERATION_PROVIDER: ${APP_GENERATION_PROVIDER:-local}
  APP_GENERATION_LOCAL_DELAY_SECONDS: ${APP_GENERATION_LOCAL_DELAY_SECONDS:-1.5}
  APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-}
  ARK_API_BASE_URL: ${ARK_API_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
  ARK_API_KEY: ${ARK_API_KEY:-}
  ARK_SEEDANCE_MODEL: ${ARK_SEEDANCE_MODEL:-doubao-seedance-2-0-260128}
  ARK_SEEDREAM_MODEL: ${ARK_SEEDREAM_MODEL:-doubao-seedream-5-0-260128}
  ARK_VIDEO_RESOLUTION: ${ARK_VIDEO_RESOLUTION:-720p}
  ARK_VIDEO_POLL_INTERVAL_SECONDS: ${ARK_VIDEO_POLL_INTERVAL_SECONDS:-5}
  ARK_VIDEO_POLL_TIMEOUT_SECONDS: ${ARK_VIDEO_POLL_TIMEOUT_SECONDS:-600}

services:

  proxy:
    image: traefik:v3.7
    volumes:
      # Add Docker as a mounted volume, so that Traefik can read the labels of other services
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log

  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  adminer:
    image: adminer
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      # Enable Traefik for this service
      - traefik.enable=true
      # Route HTTP traffic for the Adminer subdomain
      - traefik.http.routers.adminer-http.rule=Host(`adminer.${DOMAIN:-localhost}`)
      - traefik.http.routers.adminer-http.entrypoints=http
      # Define the port inside of the Docker service to use
      - traefik.http.services.adminer.loadbalancer.server.port=8080

  backend:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment: *app-environment
    volumes:
      - app-upload-data:/app/backend/uploads

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
    labels:
      # Enable Traefik for this service
      - traefik.enable=true

      # Define the port inside of the Docker service to use
      - traefik.http.services.backend.loadbalancer.server.port=8000

      # Route HTTP traffic for this domain
      - traefik.http.routers.backend-http.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.backend-http.entrypoints=http

  video-worker:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment: *app-environment
    volumes:
      - app-upload-data:/app/backend/uploads
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.workers.video_tasks"]

volumes:
  app-db-data:
  app-upload-data:
