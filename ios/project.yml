name: Vireal
options:
  bundleIdPrefix: com.usevireal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios.git
    exactVersion: 1.7.3
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  Vireal:
    type: application
    platform: iOS
    sources:
      - Vireal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usevireal.ios
        INFOPLIST_FILE: Vireal/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Clerk
        product: ClerkKit
  VirealTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VirealTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Vireal
  VirealUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VirealUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Vireal
schemes:
  Vireal:
    build:
      targets:
        Vireal: all
    test:
      targets: [VirealTests, VirealUITests]
  VirealLive:
    build:
      targets:
        Vireal: all
    test:
      targets: [VirealTests]
      environmentVariables:
        VIREAL_LIVE_READ_ONLY: "1"
